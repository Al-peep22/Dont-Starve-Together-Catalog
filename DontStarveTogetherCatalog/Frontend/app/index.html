<script>
const express = require("express");
const router = express.Router();
const AppService = require("../services/app_service"); // Adjust path to your app_service file

// If you are already using multer or another upload middleware in this file, keep your existing setup
const multer = require("multer");
const upload = multer({ dest: "public/uploads/" });

const service = new AppService();

// Find your existing router.post("/create-form") and update it:
router.post("/create-form", upload.single("image"), async (req, res) => {
    try {
        const newForm = {
            ...req.body,
            image: req.file ? req.file.filename : undefined
        };

        await service.addForm(newForm);
        res.redirect("/");
    } catch (err) {
        console.error("Error saving form:", err);
        res.status(500).send("Failed to create product.");
    }
});

module.exports = router;
</script>
